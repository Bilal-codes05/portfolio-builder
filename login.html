<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <style>
      /* Subtle floating animation */
      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }

      /* 3D Input styles - Dark themed */
      .input-3d {
        background: #1f2937; /* dark gray */
        border: 1px solid #374151; /* dark border */
        box-shadow:
          4px 4px 8px #111827,
          inset -3px -3px 6px #334155,
          inset 3px 3px 6px #4b5563;
        border-radius: 0.5rem;
        transition: all 0.3s ease;
        color: #e0e0e0;
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .input-3d::placeholder {
        color: #9ca3af;
      }

      .input-3d:hover {
        border-color: #8b5cf6; /* purple-400 */
        box-shadow:
          0 0 8px 3px #a78bfa,
          inset -3px -3px 6px #334155,
          inset 3px 3px 6px #4b5563;
        transform: scale(1.03);
      }

      .input-3d:focus {
        outline: none;
        border-color: #8b5cf6;
        box-shadow:
          0 0 8px 3px #a78bfa,
          4px 4px 8px #7c3aed,
          inset -3px -3px 6px #334155,
          inset 3px 3px 6px #4b5563;
        background: #111827;
        color: #f3f4f6;
        transform: scale(1.03);
      }

      /* Container style */
      .form-container {
        background: #111827; /* dark background */
        padding: 2rem 2.5rem;
        border-radius: 1rem;
        box-shadow:
          0 10px 25px rgba(139, 92, 246, 0.5);
        width: 100%;
        max-width: 400px;
        color: #e0e0e0;
      }

      /* Links color */
      a {
        color: #8b5cf6;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 min-h-screen flex items-center justify-center">

    <div class="form-container animate-float">
      <h2 class="text-3xl font-bold text-center mb-6 text-purple-400">Login</h2>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block mb-1 text-gray-400">Username</label>
          <input
            id="username"
            type="text"
            placeholder="Type your username"
            class="w-full py-2 input-3d focus:ring-2 focus:ring-purple-400 focus:ring-offset-0"
          />
        </div>
        <div>
          <label class="block mb-1 text-gray-400">Password</label>
          <input
            id="password"
            type="password"
            placeholder="Type your password"
            class="w-full py-2 input-3d focus:ring-2 focus:ring-purple-400 focus:ring-offset-0"
          />
          <div class="text-right text-sm mt-1">
            <a href="#" class="hover:text-purple-400">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="w-full py-2 rounded-md bg-gradient-to-r from-purple-600 to-pink-500 text-white font-semibold hover:opacity-90 transition">
          LOGIN
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-400">Or Sign Up Using</div>

      <div class="flex justify-center mt-4 space-x-4 text-gray-400 text-2xl">
        <a href="#" aria-label="Facebook" title="Facebook" class="hover:text-blue-600 transition">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="#" aria-label="Twitter" title="Twitter" class="hover:text-blue-400 transition">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="#" aria-label="Google" title="Google" class="hover:text-red-500 transition">
          <i class="fab fa-google"></i>
        </a>
      </div>

      <div class="mt-6 text-center text-sm text-gray-400">
        Don't have an account?
        <a href="register.html" class="text-purple-400 font-semibold hover:underline">Sign Up</a>
      </div>
    </div>

    <!-- Font Awesome for social icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <script>
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
          alert('Please fill in both username and password.');
          return;
        }

        window.location.href = 'project.html';
      });
    </script>

  </body>
</html>
