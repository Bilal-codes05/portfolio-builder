<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  </head>
  <body class="bg-gradient-to-br from-blue-400 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
      <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Login</h2>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-gray-700 mb-1">Username</label>
          <input id="username" type="text" placeholder="Type your username" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-purple-400" />
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Password</label>
          <input id="password" type="password" placeholder="Type your password" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-purple-400" />
          <div class="text-right text-sm mt-1">
            <a href="#" class="text-blue-500 hover:underline">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="w-full py-2 rounded-md bg-gradient-to-r from-cyan-400 to-pink-500 text-white font-semibold hover:from-cyan-500 hover:to-pink-600 transition">LOGIN</button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-600">Or Sign Up Using</div>

      <div class="flex justify-center mt-4 space-x-4">
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" class="w-8 h-8" alt="Facebook" /></a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" class="w-8 h-8" alt="Twitter" /></a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" class="w-8 h-8" alt="Google" /></a>
      </div>

      <div class="mt-6 text-center text-sm text-gray-700">
        Or Sign Up Using
        <a href="register.html" class="text-blue-600 hover:underline font-semibold">SIGN UP</a>
      </div>
    </div>

    <script>
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // prevent form submission

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
          alert('Please fill in both username and password.');
          return;
        }

        // If all fields are filled, redirect to project.html
        window.location.href = 'project.html';
      });
    </script>

  </body>
</html>
