<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gradient-to-br from-blue-400 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Create Account</h2>

    <form class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1">Full Name</label>
        <input type="text" placeholder="Your full name" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-purple-400" />
      </div>
      <div>
        <label class="block text-gray-700 mb-1">Email</label>
        <input type="email" placeholder="Your email" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-purple-400" />
      </div>
      <div>
        <label class="block text-gray-700 mb-1">Password</label>
        <input type="password" placeholder="Create a password" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-purple-400" />
      </div>
      <div>
        <label class="block text-gray-700 mb-1">Confirm Password</label>
        <input type="password" placeholder="Confirm your password" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-purple-400" />
      </div>

      <button type="submit" class="w-full py-2 font-semibold rounded-md bg-gradient-to-r from-blue-400 to-pink-500 text-white hover:opacity-90">SIGN UP</button>
    </form>

    <p class="text-center text-gray-600 mt-4">Or Sign Up Using</p>
    <div class="flex justify-center space-x-4 mt-2">
      <a href="#" class="text-blue-600 text-xl"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="text-blue-400 text-xl"><i class="fab fa-twitter"></i></a>
      <a href="#" class="text-red-500 text-xl"><i class="fab fa-google"></i></a>
    </div>

    <p class="text-center text-gray-600 mt-6">
      Already have an account?
      <a href="login.html" class="text-purple-600 font-semibold hover:underline">Login</a>
    </p>
  </div>

  <!-- Font Awesome for Icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</body>
</html>
