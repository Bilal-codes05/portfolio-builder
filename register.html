<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    /* Subtle floating animation */
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    /* 3D Input styles */
    .input-3d {
      background: #1f2937; /* dark gray background */
      border: 1px solid #374151; /* dark border */
      box-shadow:
        4px 4px 8px #111827,
        inset -3px -3px 6px #334155,
        inset 3px 3px 6px #4b5563;
      border-radius: 0.5rem;
      transition: all 0.3s ease;
      padding-left: 1rem;
      padding-right: 1rem;
      color: #e0e0e0;
    }

    .input-3d::placeholder {
      color: #9ca3af;
    }

    .input-3d:hover {
      border-color: #8b5cf6; /* purple-400 */
      box-shadow:
        0 0 8px 3px #a78bfa,
        inset -3px -3px 6px #334155,
        inset 3px 3px 6px #4b5563;
      transform: scale(1.03);
    }

    .input-3d:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow:
        0 0 8px 3px #a78bfa,
        4px 4px 8px #7c3aed,
        inset -3px -3px 6px #334155,
        inset 3px 3px 6px #4b5563;
      background: #111827;
      color: #f3f4f6;
      transform: scale(1.03);
    }

    /* Form container width and padding */
    .form-container {
      max-width: 460px; /* thoda wider */
      padding: 2rem 2.5rem;
      background: #111827; /* dark background */
      border-radius: 1rem;
      box-shadow:
        0 10px 25px rgba(139, 92, 246, 0.5);
      color: #e0e0e0;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 min-h-screen flex items-center justify-center">

  <div class="form-container animate-float">
    <h2 class="text-3xl font-bold text-center mb-6 text-purple-400">Create Account</h2>

    <form class="space-y-4">
      <div class="flex space-x-4">
        <div class="flex-1">
          <label class="block mb-1 text-gray-300">First Name</label>
          <input type="text" placeholder="First name" class="w-full py-2 input-3d focus:ring-2 focus:ring-purple-400 focus:ring-offset-0" />
        </div>
        <div class="flex-1">
          <label class="block mb-1 text-gray-300">Last Name</label>
          <input type="text" placeholder="Last name" class="w-full py-2 input-3d focus:ring-2 focus:ring-purple-400 focus:ring-offset-0" />
        </div>
      </div>

      <div>
        <label class="block mb-1 text-gray-300">Email</label>
        <input type="email" placeholder="Your email" class="w-full py-2 input-3d focus:ring-2 focus:ring-purple-400 focus:ring-offset-0" />
      </div>
      <div>
        <label class="block mb-1 text-gray-300">Password</label>
        <input type="password" placeholder="Create a password" class="w-full py-2 input-3d focus:ring-2 focus:ring-purple-400 focus:ring-offset-0" />
      </div>
      <div>
        <label class="block mb-1 text-gray-300">Confirm Password</label>
        <input type="password" placeholder="Confirm your password" class="w-full py-2 input-3d focus:ring-2 focus:ring-purple-400 focus:ring-offset-0" />
      </div>

      <button type="submit" class="w-full py-2 font-semibold rounded-md bg-gradient-to-r from-purple-600 to-pink-500 text-white hover:opacity-90 transition">
        SIGN UP
      </button>
    </form>

    <p class="text-center text-gray-400 mt-4">Or Sign Up Using</p>
    <div class="flex justify-center space-x-4 mt-2 text-gray-400 text-2xl">
      <a href="#" aria-label="Facebook" title="Facebook" class="hover:text-blue-600 transition"><i class="fab fa-facebook-f"></i></a>
      <a href="#" aria-label="Twitter" title="Twitter" class="hover:text-blue-400 transition"><i class="fab fa-twitter"></i></a>
      <a href="#" aria-label="Google" title="Google" class="hover:text-red-500 transition"><i class="fab fa-google"></i></a>
    </div>

    <p class="text-center text-gray-400 mt-6">
      Already have an account?
      <a href="login.html" class="text-purple-400 font-semibold hover:underline">Login</a>
    </p>
  </div>

  <!-- Font Awesome for Icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</body>
</html>
