<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Portfolio Builder - Portfolio</title>

  <!-- Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fadeInUp {
      animation: fadeInUp 1s ease forwards;
    }

    /* Highlighted sections with subtle backgrounds and borders */
    .highlight-section {
      background: #eff6ff; /* Tailwind blue-100 */
      border-left: 6px solid #3b82f6; /* Tailwind blue-500 */
      padding: 1.5rem 2rem;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px rgba(59, 130, 246, 0.1);
      transition: box-shadow 0.3s ease;
    }

    .highlight-section:hover {
      box-shadow: 0 15px 25px rgba(59, 130, 246, 0.25);
    }

    /* Larger font for name */
    #displayName {
      font-size: 3rem;
      font-weight: 900;
      color: #1e40af; /* Tailwind blue-900 */
      letter-spacing: 0.05em;
    }

    /* Bio styling */
    #displayBio {
      font-size: 1.5rem;
      font-weight: 500;
      color: #374151; /* Tailwind gray-700 */
      line-height: 1.8;
      white-space: pre-wrap;
    }

    /* Skills styling */
    #displaySkills {
      font-size: 1.4rem;
      font-weight: 700;
      color: #2563eb; /* Tailwind blue-600 */
      letter-spacing: 0.04em;
    }
  </style>
</head>

<body class="bg-gradient-to-r from-blue-50 via-white to-blue-50 min-h-screen flex flex-col">

  <!-- Header -->
  <header
    class="flex justify-between items-center p-6 bg-gradient-to-r from-blue-700 to-blue-900 text-white shadow-lg sticky top-0 z-50">
    <h1 class="text-3xl font-extrabold tracking-tight">Student Portfolio Builder</h1>
    <img src="folioforge.png" alt="Company Logo" class="w-14 h-14 rounded-full border-2 border-white shadow-md" />
  </header>

  <!-- Portfolio Display Container -->
  <main class="flex-grow flex flex-col items-center justify-center px-4 py-16 space-y-12 max-w-4xl mx-auto">

    <section
      class="highlight-section w-full animate-fadeInUp"
      aria-label="Name Section">
      <h2 class="sr-only">Name</h2>
      <p id="displayName">Loading...</p>
    </section>

    <section
      class="highlight-section w-full animate-fadeInUp"
      aria-label="Bio Section">
      <h2 class="sr-only">Bio</h2>
      <p id="displayBio">Loading...</p>
    </section>

    <section
      class="highlight-section w-full animate-fadeInUp"
      aria-label="Skills Section">
      <h2 class="sr-only">Skills</h2>
      <p id="displaySkills">Loading...</p>
    </section>

  </main>

  <!-- Footer -->
  <footer class="p-6 text-center text-gray-500 text-sm bg-blue-50">
    &copy; 2025 Student Portfolio Builder. All rights reserved.
  </footer>

  <script>
    $(document).ready(function () {
      const name = localStorage.getItem('portfolioName');
      const bio = localStorage.getItem('portfolioBio');
      const skills = localStorage.getItem('portfolioSkills');

      $('#displayName').text(name || 'Name not found');
      $('#displayBio').text(bio || 'Bio not found');
      $('#displaySkills').text(skills ? skills : 'Skills not found');
    });
  </script>

</body>

</html>
