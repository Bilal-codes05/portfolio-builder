<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portfolio Builder - Form</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 min-h-screen flex items-center justify-center text-gray-100">

  <div class="bg-gray-800 p-10 rounded-2xl shadow-xl w-full max-w-4xl">
    <header class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-white">Folio Forge</h1>
      <img src="folioforge.png" alt="Company Logo" class="w-40 h-30" />
    </header>

    <section id="builder">
      <h2 class="text-2xl font-bold mb-6 text-white">Build Your Portfolio</h2>
      <form id="portfolioForm" class="grid grid-cols-2 gap-6">
        <input 
          type="text" 
          name="name" 
          pattern="[A-Za-z ]+" 
          placeholder="Your Name" 
          required
          class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500" 
        />
        <input 
          type="text" 
          name="skills" 
          pattern="[A-Za-z, ]+" 
          placeholder="Skills (e.g., HTML, CSS, JS)" 
          required
          class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500" 
        />
        <textarea 
          name="bio" 
          placeholder="Your Bio" 
          required 
          class="col-span-2 w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-md resize-none focus:outline-none focus:ring-2 focus:ring-purple-500"
          rows="4"
        ></textarea>
        <button 
          type="submit" 
          class="col-span-2 w-full py-3 rounded-md bg-gradient-to-r from-cyan-500 to-pink-600 text-white font-semibold hover:from-cyan-600 hover:to-pink-700 transition"
        >
          Submit
        </button>
      </form>
    </section>
  </div>

  <script>
    $(document).ready(function () {
      $('#portfolioForm').submit(function (e) {
        e.preventDefault();

        const name = $('input[name="name"]').val();
        const bio = $('textarea[name="bio"]').val();
        const skills = $('input[name="skills"]').val();

        localStorage.setItem('portfolioName', name);
        localStorage.setItem('portfolioBio', bio);
        localStorage.setItem('portfolioSkills', skills);

        window.location.href = 'portfolio.html';
      });
    });
  </script>

</body>

</html>
